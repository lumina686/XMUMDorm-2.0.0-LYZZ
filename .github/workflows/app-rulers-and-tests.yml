name: app-rulers-and-tests

# 宪法 14.1：四把脚本必须接入 CI，作为**合并门**。
# 本工作流只跑“不需要账号”的门：四把尺子、App 检查与 Web 质量门。
# ⛔ 刻意**不**依赖 EXPO_TOKEN / EAS（把"能跑测试"与"能发构建"解耦）。

on:
  push:
    branches: [main, dev-me]
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'shared/**'
      - '__tests__/frontend/**'
      - 'tokens/**'
      - 'scripts/**'
      - 'routes/**'
      - 'server.js'
      - 'database.js'
      - 'middleware/**'
      - 'services/**'
      - 'utils/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-rulers-and-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'shared/**'
      - '__tests__/frontend/**'
      - 'tokens/**'
      - 'scripts/**'
      - 'routes/**'
      - 'server.js'
      - 'database.js'
      - 'middleware/**'
      - 'services/**'
      - 'utils/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-rulers-and-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-rulers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rulers:
    name: 四把尺子（宪法 14.1）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: 安装依赖（npm ci，锁文件生效）
        working-directory: app
        run: npm ci
      - name: 尺子 1/4 · 设计债
        run: node scripts/design-debt-report.js --path app/src --fail-on-zero
      - name: 尺子 2/4 · 对比度
        run: node scripts/contrast-check.js --file tokens/generated/tokens.check.json --fail
      - name: 尺子 3/4 · 品牌色阶准入
        run: node scripts/brand-ramp.js --hue 261.2 --fail
      - name: 尺子 4/4 · 令牌生成自校验
        run: node scripts/gen-tokens.js --check

  app-tests:
    name: App 类型检查与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: 安装依赖（npm ci，锁文件生效）
        working-directory: app
        run: npm ci
      - name: 类型检查
        working-directory: app
        run: npm run typecheck
      - name: 单测
        working-directory: app
        run: npm run test:ci

  web-quality:
    name: Web lint、构建与源码守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: 安装 Web 依赖（npm ci，锁文件生效）
        working-directory: frontend
        run: npm ci
      - name: Web lint
        working-directory: frontend
        run: npm run lint
      - name: Web 生产构建
        working-directory: frontend
        run: npm run build
      - name: 安装根目录测试依赖
        run: npm ci
      - name: Web 源码 no-undef 守卫
        run: npm test -- --runInBand __tests__/frontend/frontendSourceLint.test.js --silent

  shared-tests:
    name: 共享层单测（Web 与 App 共用）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: 安装依赖（npm ci，锁文件生效）
        run: npm ci
      # ⚠️ 为什么需要这个 job（P2D-01 补漏）：
      #   `shared/**` 是 Web 与 App **共用**的代码（例如 `shared/api/auth.js`），
      #   而上面两个 job 的 paths 都不含它 → 改共享层**一个门都不会触发**。
      #   App 侧的 `MessageKey`/类型检查管不到这里，所以单列一个 job。
      - name: 共享层单测
        run: npx jest __tests__/shared --ci

  backend-route-gate:
    name: 后端 CommonJS 路由与加载门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: 安装依赖（npm ci，锁文件生效）
        run: npm ci
      - name: 路由必须按 CommonJS 解析
        run: npm run check:routes-cjs
      - name: 加载真实 server 路由图（不监听端口）
        run: npm run check:server-load
      - name: 路由测试
        run: npm test -- --runInBand __tests__/routes
